# The Windows launcher supplies database credentials and a private signing key.
server.address=127.0.0.1
server.port=${PAHAL_PORT:8765}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=15000
app.cors.allowed-origins=http://127.0.0.1:${PAHAL_PORT:8765}
# The launcher supplies its operator key only in memory during the first-store wizard.
app.provisioning.key=${APP_PROVISIONING_KEY:}
app.desktop.control-token=${PAHAL_CONTROL_TOKEN}
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.file.name=${PAHAL_LOG_FILE}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
